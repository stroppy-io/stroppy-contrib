name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Upstream drift shows up here before it shows up in a release.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  examples:
    name: ${{ matrix.example }} (pinned SDK)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [select1, selectfile, go-tpc-tpcc]
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: ${{ matrix.example }}/go.sum
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
      - name: Run against noop
        if: matrix.example != 'go-tpc-tpcc'
        run: go run . -d noop --iterations 2
      - name: Inspect go-tpc parameters
        if: matrix.example == 'go-tpc-tpcc'
        run: go run . --help

  contract:
    name: ${{ matrix.example }} (Stroppy main)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [select1, selectfile, go-tpc-tpcc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: ${{ matrix.example }}/go.sum
      - name: Check out Stroppy main
        uses: actions/checkout@v4
        with:
          repository: stroppy-io/stroppy
          ref: main
          path: stroppy-main
      # -mod=mod updates go.mod and go.sum as the build needs. Do not run
      # `go mod tidy` here: it also resolves the test dependencies of the SDK's
      # own imports, which reach a third-party module with a mismatched path and
      # fail for reasons that have nothing to do with this contract.
      - name: Compile the example against main
        working-directory: ${{ matrix.example }}
        run: |
          go mod edit -replace github.com/stroppy-io/stroppy/v6="$GITHUB_WORKSPACE/stroppy-main"
          go build -mod=mod ./...
          go test -mod=mod ./...
          if [ "${{ matrix.example }}" = go-tpc-tpcc ]; then
            go run -mod=mod . --help
          else
            go run -mod=mod . -d noop --iterations 1
          fi

  go-tpc-databases:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver: [mysql, postgres]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: gotpc
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pgotpc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: gotpc
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: go-tpc-tpcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: go-tpc-tpcc/go.sum
      - name: Check pinned loader and transaction fingerprints
        env:
          GO_TPC_TEST_DRIVER: ${{ matrix.driver }}
        run: |
          if [ "$GO_TPC_TEST_DRIVER" = mysql ]; then
            export GO_TPC_TEST_DSN='root:gotpc@tcp(localhost:3306)/mysql'
          else
            export GO_TPC_TEST_DSN='postgres://postgres:gotpc@localhost:5432/postgres?sslmode=disable'
          fi
          go test -race -tags=integration ./workload -run '^TestDatabaseProfiles$'
