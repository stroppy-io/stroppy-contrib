name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Upstream drift shows up here before it shows up in a release.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  examples:
    name: ${{ matrix.example }} (pinned SDK)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [select1, selectfile, hammerdb-tpcc]
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: ${{ matrix.example }}/go.sum
      - name: Build
        run: go build ./...
      - name: Install Tcl generator oracle
        if: matrix.example == 'hammerdb-tpcc'
        run: sudo apt-get update -qq && sudo apt-get install -y tcl
      - name: Test
        run: go test -race ./...
      - name: Run against noop
        if: matrix.example != 'hammerdb-tpcc'
        run: go run . -d noop --iterations 2
      - name: Inspect HammerDB workload parameters
        if: matrix.example == 'hammerdb-tpcc'
        run: go run . --help

  contract:
    name: ${{ matrix.example }} (Stroppy main)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [select1, selectfile, hammerdb-tpcc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: ${{ matrix.example }}/go.sum
      - name: Check out Stroppy main
        uses: actions/checkout@v4
        with:
          repository: stroppy-io/stroppy
          ref: main
          path: stroppy-main
      # -mod=mod updates go.mod and go.sum as the build needs. Do not run
      # `go mod tidy` here: it also resolves the test dependencies of the SDK's
      # own imports, which reach a third-party module with a mismatched path and
      # fail for reasons that have nothing to do with this contract.
      - name: Compile the example against main
        working-directory: ${{ matrix.example }}
        run: |
          go mod edit -replace github.com/stroppy-io/stroppy/v6="$GITHUB_WORKSPACE/stroppy-main"
          go build -mod=mod ./...
          go test -mod=mod ./...
          if [ "${{ matrix.example }}" = hammerdb-tpcc ]; then
            go run -mod=mod . --help
          else
            go run -mod=mod . -d noop --iterations 1
          fi

  hammerdb-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: hammerdb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: hammerdb-tpcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: hammerdb-tpcc/go.sum
      - name: Run PostgreSQL profiles
        env:
          HAMMERDB_PG_URL: host=localhost port=5432 user=postgres password=hammerdb dbname=postgres sslmode=disable
        run: go test -race -tags=integration ./workload -run 'TestPostgresProfiles|TestDifferentialClient'

  hammerdb-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: hammerdb
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -phammerdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: hammerdb-tpcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: hammerdb-tpcc/go.sum
      - name: Run MySQL profiles
        env:
          HAMMERDB_MYSQL_URL: root:hammerdb@tcp(localhost:3306)/mysql?parseTime=true
        run: go test -race -tags=integration ./workload -run 'TestMySQL'
